# Same JWT validation as 02-jwt-auth-policy-cheap.yaml, different route,
# stricter authorization rule: only a token carrying the "admin" role gets
# through. An "engineer" token that works fine against the cheap model
# gets a 403 here, from the same gateway, same issuer, same key.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: jwt-rbac-expensive-model
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: expensive-model
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: "https://jwt-rbac.aaif-labs.local/"
          audiences:
            - "jwt-rbac-demo"
          jwks:
            inline: '${JWKS_INLINE}'
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - 'has(jwt.roles) && "admin" in jwt.roles'
