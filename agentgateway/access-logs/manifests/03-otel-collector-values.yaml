# Helm values for open-telemetry/opentelemetry-collector, the same chart
# family G3 already used for trace export. Here it's a plain relay for
# logs: receive OTLP from agentgateway's own accessLog.otlp export, forward
# to Loki's native OTLP log endpoint (POST /otlp/v1/logs, Loki 3.0+). No
# header injection needed since this Loki has auth_enabled: false.
mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
  exporters:
    debug:
      verbosity: detailed
    otlphttp/loki:
      logs_endpoint: http://loki.access-logs.svc.cluster.local:3100/otlp/v1/logs
      tls:
        insecure: true
  service:
    pipelines:
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug, otlphttp/loki]
