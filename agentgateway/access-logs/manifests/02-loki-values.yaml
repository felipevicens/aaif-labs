# Helm values for grafana/loki, single-binary mode with local filesystem
# storage, no auth and no gateway in front, since this lab only ever talks
# to Loki from inside the cluster. Chart default (deploymentMode:
# SimpleScalable, storage.type: s3) is built for a real multi-tenant
# install; none of that applies to a single ephemeral kind cluster.
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
deploymentMode: SingleBinary
singleBinary:
  replicas: 1
# The chart's SimpleScalable components (read/write) default to 3 replicas
# each regardless of deploymentMode; SingleBinary mode needs them at 0 or
# the chart's own validation refuses to install.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false
gateway:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
