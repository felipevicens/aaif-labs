# The Qwen3 simulator (llm-d-inference-sim) mimics a vLLM model server's API
# without downloading real weights or needing a GPU, same keyless role
# httpbun plays elsewhere in this series. Its pods carry the
# inference.networking.k8s.io/engine-type label the Inference Extension
# expects on real model-server pods, and --max-loras/--lora-modules make it
# answer as if it had a LoRA adapter loaded, enough to exercise the routing
# plumbing this post is actually about (it does not simulate GPU/KV-cache
# scoring itself: that logic lives in the EPP, not the model server).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3-32b
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vllm-qwen3-32b
  template:
    metadata:
      labels:
        app: vllm-qwen3-32b
        inference.networking.k8s.io/engine-type: vllm
    spec:
      containers:
        - name: vllm-sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
          args:
            - --model
            - Qwen/Qwen3-32B
            - --port
            - "8000"
            - --max-loras
            - "2"
            - --lora-modules
            - '{"name": "food-review-1"}'
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 10m
---
# Gateway name/port match the rest of the series (agentgateway-proxy in
# agentgateway-system, port 8080), not the docs' own "inference-gateway"
# example name - kept consistent so every lab in this repo reaches the
# proxy the same way (`kubectl port-forward ... 8080:8080`).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
