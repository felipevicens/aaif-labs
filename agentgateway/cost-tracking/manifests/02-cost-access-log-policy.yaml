# Adds the realized-cost CEL fields to every access-log line for this
# Gateway. `filter: 'true'` means log everything, not just errors, since
# the whole point here is reading the cost of successful requests.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: cost-access-log
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  frontend:
    accessLog:
      filter: 'true'
      attributes:
        add:
          - name: llm_model
            expression: 'llm.requestModel'
          - name: cost_total
            expression: 'llm.cost.total'
          - name: cost_input
            expression: 'llm.cost.input'
          - name: cost_output
            expression: 'llm.cost.output'
          - name: rate_input
            expression: 'llm.costRates.input'
          - name: rate_output
            expression: 'llm.costRates.output'
