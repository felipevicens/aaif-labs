# Turns on distributed tracing for the whole Gateway. Tracing in
# agentgateway is an AgentgatewayPolicy, not a Helm value or a Gateway
# field — this is the only resource that actually enables it.
#
# backendRef points straight at Tempo's own OTLP gRPC receiver
# (tempo.telemetry.svc.cluster.local:4317), no separate OTel Collector in
# front of it. The docs' full "OTel stack" walkthrough installs a
# collector for logs and metrics too, but a collector is not required
# just to receive traces - confirmed live, see PLAN.md.
#
# randomSampling: "true" forces sampling for every request this lab sends,
# since a plain `curl` carries no incoming traceparent header for
# clientSampling to pick up. A real deployment would use a fraction
# ("0.1") instead of always-on.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tracing
  namespace: agentgateway-system
spec:
  targetRefs:
    - kind: Gateway
      name: agentgateway-proxy
      group: gateway.networking.k8s.io
  frontend:
    tracing:
      backendRef:
        name: tempo
        namespace: telemetry
        port: 4317
      protocol: GRPC
      randomSampling: "true"
