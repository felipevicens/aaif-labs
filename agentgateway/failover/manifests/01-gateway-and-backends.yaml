# Gateway (same shape as A1) plus two httpbun-backed Deployments: one
# healthy, one deliberately broken. They are two SEPARATE Deployments/
# Services on purpose, never one Service exposing two paths: agentgateway
# tracks eviction health per (Service, endpoint), so a shared endpoint
# means evicting the broken path evicts the healthy one too, and the whole
# failover story stops proving anything. httpbun's own /status/500 route
# (https://httpbun.com/status/500) is the fault injection: no chaos
# tooling needed, just a URL.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
          - group: agentgateway.dev
            kind: AgentgatewayModel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbun
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbun
  template:
    metadata:
      labels:
        app: httpbun
    spec:
      containers:
        - name: httpbun
          image: sharat87/httpbun:e1e68994dd028ed0c8902fc26b3fd8de7f26a066
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTPBUN_BIND
              value: "0.0.0.0:3090"
          ports:
            - containerPort: 3090
---
apiVersion: v1
kind: Service
metadata:
  name: httpbun
  namespace: default
spec:
  selector:
    app: httpbun
  ports:
    - port: 3090
      targetPort: 3090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbun-primary-bad
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbun-primary-bad
  template:
    metadata:
      labels:
        app: httpbun-primary-bad
    spec:
      containers:
        - name: httpbun
          image: sharat87/httpbun:e1e68994dd028ed0c8902fc26b3fd8de7f26a066
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTPBUN_BIND
              value: "0.0.0.0:3090"
          ports:
            - containerPort: 3090
---
apiVersion: v1
kind: Service
metadata:
  name: httpbun-primary-bad
  namespace: default
spec:
  selector:
    app: httpbun-primary-bad
  ports:
    - port: 3090
      targetPort: 3090
