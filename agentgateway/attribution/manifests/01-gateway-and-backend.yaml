# Gateway + a mock backend that echoes back the exact JSON body it
# received, verbatim, inside its own response. That's what makes this lab
# checkable by hand: whatever agentgateway's finalTransformations merged
# into the outbound request is visible directly in the response, no log
# scraping needed.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: attribution-mock-backend-script
  namespace: agentgateway-system
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get('Content-Length', 0))
            raw = self.rfile.read(length)
            try:
                received = json.loads(raw or b'{}')
            except json.JSONDecodeError:
                received = {"_unparsed": raw.decode(errors='replace')}
            print("RECEIVED BODY:", json.dumps(received), flush=True)
            body = {
                "id": "chatcmpl-attributionmock000001",
                "object": "chat.completion",
                "created": 1788500000,
                "model": "demo-model",
                "received": received,
                "usage": {"prompt_tokens": 10, "completion_tokens": 5, "total_tokens": 15},
                "choices": [{
                    "index": 0,
                    "finish_reason": "stop",
                    "message": {"role": "assistant", "content": "ok"},
                }],
            }
            out = json.dumps(body).encode()
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Content-Length', str(len(out)))
            self.end_headers()
            self.wfile.write(out)

        def log_message(self, fmt, *args):
            pass

    HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attribution-mock-backend
  namespace: agentgateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attribution-mock-backend
  template:
    metadata:
      labels:
        app: attribution-mock-backend
    spec:
      containers:
        - name: attribution-mock-backend
          image: python:3.12-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: attribution-mock-backend-script
---
apiVersion: v1
kind: Service
metadata:
  name: attribution-mock-backend
  namespace: agentgateway-system
spec:
  selector:
    app: attribution-mock-backend
  ports:
    - port: 8080
      targetPort: 8080
---
# field: metadata is a real, valid object on OpenAI's own Chat Completions
# API too, so this isn't a throwaway test field: a working merge here is
# directly usable, not just a mechanism demo.
#
# finalTransformations lives at spec.policies.ai, a top-level sibling of
# spec.ai -- not nested inside spec.ai itself. Confirmed live against the
# real CRD (`kubectl explain agentgatewaybackend.spec.policies.ai`); the
# doc-summary's "spec.backend.ai.finalTransformations[]" phrasing maps to
# this resource's own spec.policies.ai, not a field under spec.ai.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: attribution-backend
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai:
        model: demo-model
      host: attribution-mock-backend.agentgateway-system.svc.cluster.local
      port: 8080
      path: "/v1/chat/completions"
  policies:
    ai:
      finalTransformations:
        - field: metadata
          expression: |
            {"user": jwt.sub, "team": request.headers["x-team"]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: attribution-backend
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /llm
      backendRefs:
        - name: attribution-backend
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
