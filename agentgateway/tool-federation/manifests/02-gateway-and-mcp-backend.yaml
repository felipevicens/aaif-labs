apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
---
# One AgentgatewayBackend federating five MCP targets, one per team, all
# running the same real MCP server (mcp-website-fetcher, tool: fetch).
# `static.host` is a plain DNS string, not a Kubernetes object reference,
# so no ReferenceGrant is needed to reach the mcp-teams namespace from here.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-teams
  namespace: agentgateway-system
spec:
  mcp:
    # Default is FailClosed: one team's server being down kills the whole
    # federated session for every caller, not just that team's tools. For
    # five independently-owned backends that is rarely what you want, so
    # this is set explicitly rather than left to the default.
    failureMode: FailOpen
    targets:
      - name: docs
        static:
          host: docs-fetcher.mcp-teams.svc.cluster.local
          port: 8000
          protocol: SSE
      - name: growth
        static:
          host: growth-fetcher.mcp-teams.svc.cluster.local
          port: 8000
          protocol: SSE
      - name: platform
        static:
          host: platform-fetcher.mcp-teams.svc.cluster.local
          port: 8000
          protocol: SSE
      - name: data
        static:
          host: data-fetcher.mcp-teams.svc.cluster.local
          port: 8000
          protocol: SSE
      - name: search
        static:
          host: search-fetcher.mcp-teams.svc.cluster.local
          port: 8000
          protocol: SSE
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-teams
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: mcp-teams
          group: agentgateway.dev
          kind: AgentgatewayBackend
