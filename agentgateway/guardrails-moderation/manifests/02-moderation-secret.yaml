# The one real credential in this whole series. Applied with:
#
#   export OPENAI_API_KEY="sk-..."
#   envsubst < 02-moderation-secret.yaml | kubectl apply -f -
#
# No envsubst? Use the same YAML in a `cat <<EOF | kubectl apply -f -`
# heredoc instead; the shell expands $OPENAI_API_KEY with no extra tools.
# Never commit a real value here. The key lives in this Secret only for the
# lifetime of the ephemeral kind cluster it's applied to.
#
# BackendAuth.secretRef reads the Secret's "Authorization" key by default
# and strips a leading "Bearer " from it if present, so a bare key works
# too, same convention already confirmed for AgentgatewayBackend's own
# secretRef in the multi-provider lab (02-openai-secret-and-backend.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: openai-secret
  namespace: agentgateway-system
type: Opaque
stringData:
  Authorization: "${OPENAI_API_KEY}"
