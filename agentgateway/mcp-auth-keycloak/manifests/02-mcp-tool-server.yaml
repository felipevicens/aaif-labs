# An ordinary, unauthenticated MCP tool server. It has no idea a JWT
# exists anywhere in this lab: everything auth-related happens at the
# gateway, in front of it, via 05-jwt-auth-policy.yaml. That's the whole
# point of gateway-level MCP auth: any MCP server, even one with zero
# auth code of its own, gets protected the same way.
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-auth
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-tool-server-script
  namespace: mcp-auth
data:
  server.py: |
    from mcp.server.mcpserver import MCPServer

    mcp = MCPServer("mcp-tool-server")

    @mcp.tool()
    def whoami() -> str:
        """Return a fixed string identifying this tool server. Useful for
        proving a call actually reached the backend, not just the gateway."""
        return "mcp-tool-server: this call reached the real backend"

    if __name__ == "__main__":
        mcp.run(transport="streamable-http", host="0.0.0.0", port=8000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tool-server
  namespace: mcp-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-tool-server
  template:
    metadata:
      labels:
        app: mcp-tool-server
    spec:
      containers:
        - name: mcp-tool-server
          image: python:3.12-slim
          command: ["sh", "-c", "pip install --quiet mcp && python3 /app/server.py"]
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: mcp-tool-server-script
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-tool-server
  namespace: mcp-auth
spec:
  selector:
    app: mcp-tool-server
  ports:
    - port: 8000
      targetPort: 8000
