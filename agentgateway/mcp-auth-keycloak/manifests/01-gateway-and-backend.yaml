apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
---
# One target, one MCP server, on purpose: this lab is about authenticating
# the client to the gateway, not about federation. `static.host` is a
# plain DNS string, so no ReferenceGrant is needed to reach the
# mcp-auth namespace from here (same as D1/D3/D4).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-server
  namespace: agentgateway-system
spec:
  mcp:
    targets:
      - name: mcp-server
        static:
          host: mcp-tool-server.mcp-auth.svc.cluster.local
          port: 8000
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-server
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: mcp-server
          group: agentgateway.dev
          kind: AgentgatewayBackend
    # The MCP OAuth metadata endpoints (protected-resource, authorization-
    # server, proxied Dynamic Client Registration) only get served for
    # paths the HTTPRoute actually routes — a route matching just `/mcp`
    # 404s on `/.well-known/...` before any auth policy runs. Same backend
    # works: the JWT auth policy intercepts these paths itself.
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known
      backendRefs:
        - name: mcp-server
          group: agentgateway.dev
          kind: AgentgatewayBackend
