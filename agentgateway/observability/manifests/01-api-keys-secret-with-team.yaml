# Extends post 1's llm-api-keys Secret: each person now also carries a "team".
# metadata is free-form (post 1 already noted this), so adding "team" alongside
# "user_id" needs no schema change, just a new key in the JSON blob per person.
apiVersion: v1
kind: Secret
metadata:
  name: llm-api-keys
  namespace: agentgateway-system
type: Opaque
stringData:
  alice: |
    { "key": "sk-alice-abc123def456", "metadata": { "user_id": "alice", "team": "platform" } }
  bob: |
    { "key": "sk-bob-xyz789uvw012", "metadata": { "user_id": "bob", "team": "platform" } }
  carol: |
    { "key": "sk-carol-newkey999", "metadata": { "user_id": "carol", "team": "data-science" } }
