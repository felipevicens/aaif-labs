# Istio's own ext-authz test fixture, not a stub written for this post:
# it implements the Envoy external-authorization gRPC proto and allows any
# request carrying the header `x-ext-authz: allow`, denying everything
# else. Two ports: 8000 (its own HTTP admin surface, unused here) and
# 9000 (the gRPC check port agentgateway actually talks to).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-authz
  namespace: agentgateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ext-authz
  template:
    metadata:
      labels:
        app: ext-authz
    spec:
      containers:
        - name: ext-authz
          image: gcr.io/istio-testing/ext-authz:1.25-dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
            - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: ext-authz
  namespace: agentgateway-system
spec:
  selector:
    app: ext-authz
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 9000
      targetPort: 9000
