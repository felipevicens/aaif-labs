# Set where your model lives, then apply (envsubst fills in the ${...} values):
#   export LLM_MODEL="gpt-oss-120b" LLM_HOST="your.vllm.host" LLM_PORT="8000"
#   envsubst < 01-gateway-backend-route.yaml | kubectl apply -f -
# No envsubst? The post shows the same YAML as a `cat <<EOF | kubectl apply -f -`
# heredoc, which the shell expands with no extra tools.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - protocol: HTTP
      port: 8080
      name: http
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: local-llm
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai:
        model: "${LLM_MODEL}"
      host: ${LLM_HOST}
      port: ${LLM_PORT}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: local-llm
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /llm
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/chat/completions
      backendRefs:
        - name: local-llm
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
