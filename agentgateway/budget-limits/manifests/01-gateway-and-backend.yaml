# A plain HTTP backend, not an LLM-shaped one: this lab's budget mechanism
# (AgentgatewayPolicy's rateLimit + apiKeyAuthentication) is generic Gateway
# API traffic control, not an LLM-only feature. It doesn't need token
# counts, so a two-line 200-OK responder is enough to prove every gotcha
# below by hand.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: budget-mock-backend-script
  namespace: agentgateway-system
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get('Content-Length', 0))
            self.rfile.read(length)
            out = b'{"status":"ok"}'
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Content-Length', str(len(out)))
            self.end_headers()
            self.wfile.write(out)

        def log_message(self, fmt, *args):
            pass

    HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-mock-backend
  namespace: agentgateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-mock-backend
  template:
    metadata:
      labels:
        app: budget-mock-backend
    spec:
      containers:
        - name: budget-mock-backend
          image: python:3.12-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: budget-mock-backend-script
---
apiVersion: v1
kind: Service
metadata:
  name: budget-mock-backend
  namespace: agentgateway-system
spec:
  selector:
    app: budget-mock-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: budget-mock-backend
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /work
      backendRefs:
        - name: budget-mock-backend
          namespace: agentgateway-system
          port: 8080
