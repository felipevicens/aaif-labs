# Three keys, two teams: alice and carol are both on "platform"; bob is
# alone on "research". team_id is a free-form metadata field, same
# mechanism virtual-keys already used for user_id, read into CEL as
# apiKey.team_id / apiKey.user_id.
apiVersion: v1
kind: Secret
metadata:
  name: budget-api-keys
  namespace: agentgateway-system
type: Opaque
stringData:
  alice: |
    {
      "key": "sk-alice-team-platform",
      "metadata": {
        "user_id": "alice",
        "team_id": "platform"
      }
    }
  carol: |
    {
      "key": "sk-carol-team-platform",
      "metadata": {
        "user_id": "carol",
        "team_id": "platform"
      }
    }
  bob: |
    {
      "key": "sk-bob-team-research",
      "metadata": {
        "user_id": "bob",
        "team_id": "research"
      }
    }
