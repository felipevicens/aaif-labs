# Two descriptor items in one policy, checked on every request:
#   1. team_id alone -> the shared team pool counter.
#   2. team_id + user_id together -> that person's own sub-limit inside it.
# Either one alone can trip a 429; the request only succeeds when both
# have room left.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: budget-api-key-auth
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: budget-api-keys
    rateLimit:
      global:
        domain: agentgateway
        backendRef:
          kind: Service
          name: ratelimit
          namespace: ratelimit
          port: 8081
        descriptors:
          - entries:
              - name: team_id
                expression: "apiKey.team_id"
            unit: Requests
          - entries:
              - name: team_id
                expression: "apiKey.team_id"
              - name: user_id
                expression: "apiKey.user_id"
            unit: Requests
