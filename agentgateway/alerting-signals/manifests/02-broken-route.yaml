# Scenario 1: a Kubernetes-resource-layer failure. This HTTPRoute points
# at a Service that does not exist. The Gateway API spec requires the
# controller to surface this as a `ResolvedRefs: False` condition on the
# route's own status, immediately visible via `kubectl get httproute -o
# yaml` - no proxy logs, no metrics endpoint, no live traffic needed.
# This is the layer with the best existing tooling: `kubectl` alone tells
# you the resource is broken before a single request is ever sent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: broken-route
  namespace: alerting-signals
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  hostnames:
    - "alerting.internal"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /broken
      backendRefs:
        - name: httpbun-does-not-exist
          port: 80
