# Namespace, the httpbun echo backend, the Gateway, and two HTTPRoute
# rules: /good (a normal working request) and /flaky (rewritten to
# httpbun's /status/500, a genuine backend failure with nothing wrong in
# any gateway config at all). Both are deliberately correct as Kubernetes
# resources - /flaky is meant to 500, that's the point. This is the
# noisy, "usually not your fault" layer, kept separate from the two
# resources applied later (a broken route and a broken out-of-band
# policy) that ARE gateway misconfigurations.
apiVersion: v1
kind: Namespace
metadata:
  name: alerting-signals
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbun
  namespace: alerting-signals
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbun
  template:
    metadata:
      labels:
        app: httpbun
    spec:
      containers:
        - name: httpbun
          image: sharat87/httpbun:e1e68994dd028ed0c8902fc26b3fd8de7f26a066
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: httpbun
  namespace: alerting-signals
spec:
  selector:
    app: httpbun
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: good-route
  namespace: alerting-signals
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  hostnames:
    - "alerting.internal"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /good
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /get
      backendRefs:
        - name: httpbun
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /flaky
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /status/500
      backendRefs:
        - name: httpbun
          port: 80
