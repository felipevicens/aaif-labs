# A tiny, lab-owned webhook implementing the real Guardrail Webhook API
# contract (POST /request, POST /response, a discriminated Pass/Mask/Reject
# JSON response), so Scenario A can chain a second, domain-specific guard
# after the regex layer. Every call it receives is printed to stdout, which
# is how the post proves ordering: a request the regex guard already
# rejected never shows up in this pod's logs at all.
apiVersion: v1
kind: ConfigMap
metadata:
  name: guardrail-webhook-script
  namespace: agentgateway-system
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    FORBIDDEN = "wire transfer"

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get('Content-Length', 0))
            raw = self.rfile.read(length)
            try:
                payload = json.loads(raw or b'{}')
            except json.JSONDecodeError:
                payload = {}
            text = json.dumps(payload).lower()
            if self.path == '/request' and FORBIDDEN in text:
                verdict = "Reject"
                action = {
                    "body": "Blocked by guardrail webhook: wire transfer requests need human review",
                    "status_code": 403,
                    "reason": "forbidden-keyword",
                }
            else:
                verdict = "Pass"
                action = {"reason": None}
            result = {"action": action}
            out = json.dumps(result).encode()
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Content-Length', str(len(out)))
            self.end_headers()
            self.wfile.write(out)
            print(self.path + " -> " + verdict, flush=True)

        def log_message(self, fmt, *args):
            pass

    HTTPServer(('0.0.0.0', 8000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail-webhook
  namespace: agentgateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guardrail-webhook
  template:
    metadata:
      labels:
        app: guardrail-webhook
    spec:
      containers:
        - name: guardrail-webhook
          image: python:3.12-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: guardrail-webhook-script
---
apiVersion: v1
kind: Service
metadata:
  name: guardrail-webhook
  namespace: agentgateway-system
spec:
  selector:
    app: guardrail-webhook
  ports:
    - port: 8000
      targetPort: 8000
