# Scenario 1: the keyless path. Every reader can finish it with zero provider
# credentials, because httpbun is a mock that answers in OpenAI's shape
# instead of calling a real model.
#
# The whole lab is built around ONE route and ONE backend name. The HTTPRoute
# below matches /v1/chat/completions, the exact path the OpenAI SDKs call, so
# an app only has to change its base_url to http://<gateway>/v1. Scenarios 2,
# 4 and 5 re-apply the same AgentgatewayBackend `llm` with a different
# provider. The route and the client never change.
#
# No URLRewrite filter. Confirmed live on 1.5.0: a route with no rewrite at
# all, on any path, still reaches httpbun and still gets the request
# translated for gemini/anthropic providers (see 03). The native providers
# (openai, anthropic, gemini) set their own upstream path. For httpbun the
# upstream path comes from `path` below, not from the client.
#
# httpbun is an `openai` provider with host/port/path overrides, not
# `custom`: LLMProvider only knows named providers plus overrides.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - protocol: HTTP
      port: 8080
      name: http
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbun
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbun
  template:
    metadata:
      labels:
        app: httpbun
    spec:
      containers:
        - name: httpbun
          # sharat87/httpbun ships no semver tags, so this is the commit-hash
          # tag `latest` resolved to when the lab was validated. An untagged
          # image defaults to imagePullPolicy Always and re-pulls on every
          # restart, even when the image is already on the node.
          image: sharat87/httpbun:e1e68994dd028ed0c8902fc26b3fd8de7f26a066
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTPBUN_BIND
              value: "0.0.0.0:3090"
          ports:
            - containerPort: 3090
---
apiVersion: v1
kind: Service
metadata:
  name: httpbun
  namespace: default
spec:
  selector:
    app: httpbun
  ports:
    - port: 3090
      targetPort: 3090
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai:
        # The backend's model wins over whatever model the client sends.
        # httpbun echoes it back, which makes that override easy to see.
        model: gpt-4
      host: httpbun.default.svc.cluster.local
      port: 3090
      path: /llm/chat/completions
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      backendRefs:
        - name: llm
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
