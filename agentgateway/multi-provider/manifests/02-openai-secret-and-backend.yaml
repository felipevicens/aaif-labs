# Scenario 2: a single real provider, OpenAI, on its own route so it can be
# tested independently of the multi-provider backend in Scenario 3 (which
# reuses this same Secret).
#
# export OPENAI_API_KEY="sk-..."
# envsubst < 02-openai-secret-and-backend.yaml | kubectl apply -f -
# No envsubst? Use the same YAML in a `cat <<EOF | kubectl apply -f -`
# heredoc instead; the shell expands $OPENAI_API_KEY with no extra tools.
#
# BackendAuth.secretRef reads the Secret's "Authorization" key by default and
# strips a leading "Bearer " from it if present, so a bare key works too —
# stored bare here to avoid a stray double "Bearer ".
#
# No host/port/path override on the provider (unlike httpbun in Scenario 1):
# "openai" is a native provider, agentgateway already knows its real
# endpoint. Confirmed against the agentgateway docs' own OpenAI provider
# page, which shows the exact same HTTPRoute shape below (PathPrefix match
# + URLRewrite to /v1/chat/completions) as one of its two supported patterns
# for a native provider, and it matches the virtual-keys post (P1)'s
# already-validated route for its self-hosted backend.
apiVersion: v1
kind: Secret
metadata:
  name: openai-credentials
  namespace: agentgateway-system
type: Opaque
stringData:
  Authorization: "${OPENAI_API_KEY}"
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openai-llm
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai:
        model: gpt-4o-mini
  # `policies` is a SIBLING of `ai` on AgentgatewayBackendSpec, not nested
  # inside it. Confirmed live: `spec.ai.policies` gets rejected by the API
  # server with "strict decoding error: unknown field \"spec.ai.policies\"".
  # Matches the CRD reference (AgentgatewayBackendSpec.policies) and the
  # agentgateway docs' own OpenAI provider example. See Gotchas in the post.
  policies:
    auth:
      secretRef:
        name: openai-credentials
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openai-llm
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /llm/openai
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/chat/completions
      backendRefs:
        - name: openai-llm
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
