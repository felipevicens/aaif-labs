# Pins the kind node image so `kind create cluster` doesn't pick up whatever
# kindest/node tag happens to be cached locally. v1.34.0 is the version this
# lab (manifests + scripts/setup.sh) was written and dry-run checked against.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0
