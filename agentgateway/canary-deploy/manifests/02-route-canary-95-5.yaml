# Stage 1 of the rollout: a small blast radius. 95% of traffic keeps
# going to the stable version, 5% starts exercising the canary. The
# URLRewrite to /get is shared by the whole rule, so both backends
# return the exact same response shape regardless of which one answers.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary-completions
  namespace: canary
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /get
      backendRefs:
        - name: model-v1-stable
          port: 3090
          weight: 95
        - name: model-v2-canary
          port: 3090
          weight: 5
