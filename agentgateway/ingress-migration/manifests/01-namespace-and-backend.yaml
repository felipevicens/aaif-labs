# httpbun stands in for whatever real backend was behind the original
# ingress-nginx Ingress, same pattern as the rest of this series. One
# Gateway with two listeners, one hostname per migrated scenario, both on
# the same port 8080 this series always port-forwards to.
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-migration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbun
  namespace: ingress-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbun
  template:
    metadata:
      labels:
        app: httpbun
    spec:
      containers:
        - name: httpbun
          image: sharat87/httpbun:e1e68994dd028ed0c8902fc26b3fd8de7f26a066
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTPBUN_BIND
              value: "0.0.0.0:3090"
          ports:
            - containerPort: 3090
---
apiVersion: v1
kind: Service
metadata:
  name: httpbun
  namespace: ingress-migration
spec:
  selector:
    app: httpbun
  ports:
    - port: 3090
      targetPort: 3090
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: cors-migrate-local-http
      hostname: cors.migrate.local
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
    - name: secure-migrate-local-http
      hostname: secure.migrate.local
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
