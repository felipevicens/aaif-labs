# The real output of:
#   ingress2gateway print --providers=ingress-nginx --emitter=agentgateway \
#     --input-file manifests/03-before-ingress-basic-auth.yaml
#
# Same two mechanical edits as 04-cors-migrated.yaml: Gateway block
# dropped (shared Gateway already defined), HTTPRoute's parentRef points
# at it. The Secret below is NOT something the tool generates — it only
# emits the AgentgatewayPolicy.spec.traffic.basicAuthentication.secretRef
# pointing at a Secret named "basic-auth-secret" that has to already
# exist, or be created separately, exactly like this one. See the post's
# Gotcha for the htpasswd key mismatch (.htaccess here, not auth) that the
# tool's own INFO output calls out.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: basic-auth-demo-secure-migrate-local
  namespace: ingress-migration
  annotations:
    gateway.networking.k8s.io/generator: ingress2gateway-v0.5.0
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  hostnames:
    - secure.migrate.local
  rules:
    - name: rule-0
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: httpbun
          port: 3090
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: basic-auth-demo
  namespace: ingress-migration
  annotations:
    gateway.networking.k8s.io/generator: ingress2gateway-v0.5.0
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: basic-auth-demo-secure-migrate-local
  traffic:
    basicAuthentication:
      secretRef:
        name: basic-auth-secret
---
# Not tool output: the Secret the AgentgatewayPolicy above references.
# user "aaif", password "letmein123", hashed with
# `openssl passwd -apr1 -salt aaif1lab 'letmein123'` (no htpasswd binary
# needed — same APR1 format). Key is `.htaccess`, agentgateway's own
# expectation, not ingress-nginx's `auth`.
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth-secret
  namespace: ingress-migration
stringData:
  .htaccess: |
    aaif:$apr1$aaif1lab$dXf0Jv6u6xDZ/FrhfkIo11
