# The real output of:
#   ingress2gateway print --providers=ingress-nginx --emitter=agentgateway \
#     --input-file manifests/02-before-ingress-cors.yaml
#
# Copied verbatim except for two mechanical edits any reader would also
# make: the Gateway block is dropped (01-namespace-and-backend.yaml
# already defines one shared Gateway, agentgateway-proxy, with a listener
# for this hostname) and the HTTPRoute's parentRef points at it. Nothing
# in the HTTPRoute or AgentgatewayPolicy spec itself was touched — see the
# post's Gotcha for why CORS shows up twice below (a native Gateway API
# `CORS` HTTPRoute filter *and* an AgentgatewayPolicy saying the same
# thing), which is exactly what the tool printed, not a mistake made here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cors-demo-cors-migrate-local
  namespace: ingress-migration
  annotations:
    gateway.networking.k8s.io/generator: ingress2gateway-v0.5.0
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  hostnames:
    - cors.migrate.local
  rules:
    - name: rule-0
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: httpbun
          port: 3090
      filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://app.allowed.example
            allowMethods:
              - GET
              - POST
              - OPTIONS
            allowHeaders:
              - Authorization
              - Content-Type
            allowCredentials: true
            maxAge: 3600
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            remove:
              - Access-Control-Allow-Origin
              - Access-Control-Allow-Methods
              - Access-Control-Allow-Headers
              - Access-Control-Expose-Headers
              - Access-Control-Max-Age
              - Access-Control-Allow-Credentials
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: cors-demo
  namespace: ingress-migration
  annotations:
    gateway.networking.k8s.io/generator: ingress2gateway-v0.5.0
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: cors-demo-cors-migrate-local
  traffic:
    cors:
      allowOrigins:
        - https://app.allowed.example
      allowMethods:
        - GET
        - POST
        - OPTIONS
      allowHeaders:
        - Authorization
        - Content-Type
      allowCredentials: true
      maxAge: 3600
