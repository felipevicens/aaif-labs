# One namespace, one httpbun backend, and the Gateway. Every scenario in
# this lab runs against this single backend — the point is what agentgateway
# itself does under fault/retry/timeout policy, not multi-service routing.
apiVersion: v1
kind: Namespace
metadata:
  name: resiliency
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbun
  namespace: resiliency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbun
  template:
    metadata:
      labels:
        app: httpbun
    spec:
      containers:
        - name: httpbun
          image: sharat87/httpbun:e1e68994dd028ed0c8902fc26b3fd8de7f26a066
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTPBUN_BIND
              value: "0.0.0.0:3090"
          ports:
            - containerPort: 3090
---
apiVersion: v1
kind: Service
metadata:
  name: httpbun
  namespace: resiliency
spec:
  selector:
    app: httpbun
  ports:
    - port: 3090
      targetPort: 3090
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - protocol: HTTP
      port: 8080
      name: http
      allowedRoutes:
        namespaces:
          from: All
