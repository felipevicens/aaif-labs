# The platform team's parent HTTPRoute. Both rules delegate to a child
# HTTPRoute instead of a real backend: the backendRef's kind is HTTPRoute,
# not Service. /team1 pins a 1s request timeout that the child inherits;
# /team2 sets no timeout, so whatever the child (or grandchild) declares
# wins.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parent-route
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /team1
      timeouts:
        request: 1s
      backendRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: child-team1
          namespace: team1
    - matches:
        - path:
            type: PathPrefix
            value: /team2
      backendRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: child-team2
          namespace: team2
