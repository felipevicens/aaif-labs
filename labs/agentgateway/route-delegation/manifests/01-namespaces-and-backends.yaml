# Two team namespaces, each with its own httpbun backend, plus the shared
# Gateway the platform team owns. team1 demonstrates a single delegation
# hop; team2 delegates one level further to a grandchild HTTPRoute in the
# same namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: team1
---
apiVersion: v1
kind: Namespace
metadata:
  name: team2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbun
  namespace: team1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbun
  template:
    metadata:
      labels:
        app: httpbun
    spec:
      containers:
        - name: httpbun
          image: sharat87/httpbun:e1e68994dd028ed0c8902fc26b3fd8de7f26a066
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTPBUN_BIND
              value: "0.0.0.0:3090"
          ports:
            - containerPort: 3090
---
apiVersion: v1
kind: Service
metadata:
  name: httpbun
  namespace: team1
spec:
  selector:
    app: httpbun
  ports:
    - port: 3090
      targetPort: 3090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbun
  namespace: team2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbun
  template:
    metadata:
      labels:
        app: httpbun
    spec:
      containers:
        - name: httpbun
          image: sharat87/httpbun:e1e68994dd028ed0c8902fc26b3fd8de7f26a066
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTPBUN_BIND
              value: "0.0.0.0:3090"
          ports:
            - containerPort: 3090
---
apiVersion: v1
kind: Service
metadata:
  name: httpbun
  namespace: team2
spec:
  selector:
    app: httpbun
  ports:
    - port: 3090
      targetPort: 3090
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - protocol: HTTP
      port: 8080
      name: http
      allowedRoutes:
        namespaces:
          from: All
